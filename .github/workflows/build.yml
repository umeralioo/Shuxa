name: build-ffguard
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup NDK r25c
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "NDK=$PWD/android-ndk-r25c" >> $GITHUB_ENV
      - name: Prepare jni
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -1); echo "zip: $ZIP"
          if [ -n "$ZIP" ]; then rm -rf jni tmp_jni && mkdir -p jni && unzip -o "$ZIP" -d tmp_jni && ( [ -d tmp_jni/jni ] && cp tmp_jni/jni/* jni/ || cp tmp_jni/* jni/ ) && rm -rf tmp_jni; fi
          ls jni
      - name: ndk-build
        run: $NDK/ndk-build NDK_PROJECT_PATH=.
      - name: Upload libs
        uses: actions/upload-artifact@v4
        with:
          name: libs
          path: libs/
